<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" width="100%" height="auto" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="mmBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="centerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="mmShadow" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
  </defs>

  <rect width="840" height="430" rx="16" fill="url(#mmBg)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Curved Connecting Branches -->
  <!-- Top-Left Branch (Blue) -->
  <path d="M 350 205 C 290 205, 285 110, 230 110" fill="none" stroke="#3b82f6" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 140 110 C 110 110, 110 62, 85 62" fill="none" stroke="#93c5fd" stroke-width="2"/>
  <path d="M 140 110 C 110 110, 110 110, 85 110" fill="none" stroke="#93c5fd" stroke-width="2"/>
  <path d="M 140 110 C 110 110, 110 158, 85 158" fill="none" stroke="#93c5fd" stroke-width="2"/>

  <!-- Bottom-Left Branch (Emerald) -->
  <path d="M 350 225 C 290 225, 285 320, 230 320" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 140 320 C 110 320, 110 272, 85 272" fill="none" stroke="#6ee7b7" stroke-width="2"/>
  <path d="M 140 320 C 110 320, 110 320, 85 320" fill="none" stroke="#6ee7b7" stroke-width="2"/>
  <path d="M 140 320 C 110 320, 110 368, 85 368" fill="none" stroke="#6ee7b7" stroke-width="2"/>

  <!-- Top-Right Branch (Amber) -->
  <path d="M 490 205 C 550 205, 555 110, 610 110" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 700 110 C 730 110, 730 62, 755 62" fill="none" stroke="#fcd34d" stroke-width="2"/>
  <path d="M 700 110 C 730 110, 730 110, 755 110" fill="none" stroke="#fcd34d" stroke-width="2"/>
  <path d="M 700 110 C 730 110, 730 158, 755 158" fill="none" stroke="#fcd34d" stroke-width="2"/>

  <!-- Bottom-Right Branch (Rose) -->
  <path d="M 490 225 C 550 225, 555 320, 610 320" fill="none" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 700 320 C 730 320, 730 272, 755 272" fill="none" stroke="#fda4af" stroke-width="2"/>
  <path d="M 700 320 C 730 320, 730 320, 755 320" fill="none" stroke="#fda4af" stroke-width="2"/>
  <path d="M 700 320 C 730 320, 730 368, 755 368" fill="none" stroke="#fda4af" stroke-width="2"/>

  <!-- Center Node -->
  <g filter="url(#mmShadow)">
    <rect x="336" y="176" width="168" height="78" rx="16" fill="url(#centerGrad)"/>
  </g>
  <text x="420" y="210" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">知识拆解 20 法则</text>
  <text x="420" y="234" font-size="12.5" font-weight="500" fill="#cbd5e1" text-anchor="middle">高效长期记忆脑图</text>

  <!-- Node 1: Top-Left (Blue) -->
  <g filter="url(#mmShadow)">
    <rect x="132" y="88" width="114" height="44" rx="10" fill="#2563eb"/>
  </g>
  <text x="189" y="115" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1. 先懂后记</text>

  <!-- Leaf nodes Top-Left -->
  <rect x="16" y="44" width="96" height="34" rx="7" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="64" y="66" font-size="12" font-weight="600" fill="#1e40af" text-anchor="middle">不理解不硬背</text>

  <rect x="16" y="93" width="96" height="34" rx="7" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="64" y="115" font-size="12" font-weight="600" fill="#1e40af" text-anchor="middle">先建全局框架</text>

  <rect x="16" y="142" width="96" height="34" rx="7" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="64" y="164" font-size="12" font-weight="600" fill="#1e40af" text-anchor="middle">夯实基础概念</text>

  <!-- Node 2: Bottom-Left (Emerald) -->
  <g filter="url(#mmShadow)">
    <rect x="132" y="298" width="114" height="44" rx="10" fill="#059669"/>
  </g>
  <text x="189" y="325" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2. 化繁为简</text>

  <!-- Leaf nodes Bottom-Left -->
  <rect x="16" y="254" width="96" height="34" rx="7" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="64" y="276" font-size="12" font-weight="600" fill="#065f46" text-anchor="middle">最小信息原则</text>

  <rect x="16" y="303" width="96" height="34" rx="7" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="64" y="325" font-size="12" font-weight="600" fill="#065f46" text-anchor="middle">善用挖空填充</text>

  <rect x="16" y="352" width="96" height="34" rx="7" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="64" y="374" font-size="12" font-weight="600" fill="#065f46" text-anchor="middle">拆解集合与序列</text>

  <!-- Node 3: Top-Right (Amber) -->
  <g filter="url(#mmShadow)">
    <rect x="594" y="88" width="114" height="44" rx="10" fill="#d97706"/>
  </g>
  <text x="651" y="115" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3. 视觉与具象</text>

  <!-- Leaf nodes Top-Right -->
  <rect x="728" y="44" width="96" height="34" rx="7" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
  <text x="776" y="66" font-size="12" font-weight="600" fill="#92400e" text-anchor="middle">图像与区域遮挡</text>

  <rect x="728" y="93" width="96" height="34" rx="7" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
  <text x="776" y="115" font-size="12" font-weight="600" fill="#92400e" text-anchor="middle">脑图与助记口诀</text>

  <rect x="728" y="142" width="96" height="34" rx="7" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
  <text x="776" y="164" font-size="12" font-weight="600" fill="#92400e" text-anchor="middle">个人经历与情绪</text>

  <!-- Node 4: Bottom-Right (Rose) -->
  <g filter="url(#mmShadow)">
    <rect x="594" y="298" width="114" height="44" rx="10" fill="#e11d48"/>
  </g>
  <text x="651" y="325" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4. 抗干扰与管理</text>

  <!-- Leaf nodes Bottom-Right -->
  <rect x="728" y="254" width="96" height="34" rx="7" fill="#ffffff" stroke="#fecdd3" stroke-width="1.5"/>
  <text x="776" y="276" font-size="12" font-weight="600" fill="#9f1239" text-anchor="middle">消除相似干扰</text>

  <rect x="728" y="303" width="96" height="34" rx="7" fill="#ffffff" stroke="#fecdd3" stroke-width="1.5"/>
  <text x="776" y="325" font-size="12" font-weight="600" fill="#9f1239" text-anchor="middle">极简措辞与标签</text>

  <rect x="728" y="352" width="96" height="34" rx="7" fill="#ffffff" stroke="#fecdd3" stroke-width="1.5"/>
  <text x="776" y="374" font-size="12" font-weight="600" fill="#9f1239" text-anchor="middle">来源与优先级</text>

  <!-- Bottom Caption -->
  <text x="420" y="408" font-size="12" fill="#64748b" text-anchor="middle">思维导图把抽象的逻辑关系转化为空间连接，让知识碎片在脑中连成一张坚固的网</text>
</svg>
