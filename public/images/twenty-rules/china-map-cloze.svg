<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="100%" height="auto" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="highlightGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="820" height="380" rx="16" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Left Card: Verbal Only -->
  <g filter="url(#cardShadow)">
    <rect x="24" y="24" width="370" height="332" rx="12" fill="#ffffff" stroke="#fecdd3" stroke-width="1.5"/>
  </g>
  <rect x="24" y="24" width="370" height="44" rx="12" fill="#fff1f2"/>
  <rect x="24" y="56" width="370" height="12" fill="#fff1f2"/>
  <circle cx="48" cy="46" r="10" fill="#f43f5e"/>
  <path d="M44 42 L52 50 M52 42 L44 50" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <text x="68" y="51" font-size="15" font-weight="700" fill="#9f1239">低效制卡：纯文字空间描述</text>

  <!-- Question box left -->
  <rect x="44" y="88" width="330" height="112" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="114" font-size="13" font-weight="700" fill="#64748b">问题（Q）：</text>
  <text x="60" y="140" font-size="14.5" fill="#1e293b">位于湖北、安徽、浙江、福建、</text>
  <text x="60" y="164" font-size="14.5" fill="#1e293b">广东、湖南六省交界包围之中的，</text>
  <text x="60" y="188" font-size="14.5" fill="#1e293b">是中国的哪个省份？</text>

  <!-- Answer box left -->
  <rect x="44" y="214" width="330" height="54" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
  <text x="60" y="246" font-size="14.5" font-weight="700" fill="#be123c">答案（A）：江西省</text>

  <!-- Explanation left -->
  <text x="44" y="298" font-size="12.5" fill="#64748b">• 大脑被迫先在脑海中检索 6 个省份的名称</text>
  <text x="44" y="318" font-size="12.5" fill="#64748b">• 靠文字硬拼空间方位，阅读慢、极易产生记忆干扰</text>
  <text x="44" y="338" font-size="12.5" fill="#64748b">• 换个问法（如问江西东邻哪两省）又会卡壳</text>

  <!-- Right Card: Visual Map Cloze -->
  <g filter="url(#cardShadow)">
    <rect x="418" y="24" width="378" height="332" rx="12" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
  </g>
  <rect x="418" y="24" width="378" height="44" rx="12" fill="#f0fdf4"/>
  <rect x="418" y="56" width="378" height="12" fill="#f0fdf4"/>
  <circle cx="442" cy="46" r="10" fill="#10b981"/>
  <path d="M437 46 L440.5 49.5 L447.5 42.5" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="462" y="51" font-size="15" font-weight="700" fill="#065f46">高效制卡：图像挖空（视觉皮层直觉）</text>

  <text x="438" y="92" font-size="13.5" font-weight="600" fill="#334155">问题（Q）：地图中橙色高亮标出的是哪个省？</text>

  <!-- Stylized Topological Map of Jiangxi & 6 Neighboring Provinces -->
  <g transform="translate(438, 104)">
    <rect x="0" y="0" width="338" height="186" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>

    <!-- Hubei (North-West) -->
    <polygon points="45,14 155,14 162,56 112,68 40,56" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="100" y="42" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">湖北</text>

    <!-- Anhui (North-East) -->
    <polygon points="155,14 245,14 252,58 198,68 162,56" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="204" y="42" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">安徽</text>

    <!-- Zhejiang (East-North) -->
    <polygon points="252,58 312,48 316,96 242,102 198,68" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="268" y="80" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">浙江</text>

    <!-- Hunan (West) -->
    <polygon points="40,56 112,68 118,142 46,146 32,98" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="76" y="108" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">湖南</text>

    <!-- Fujian (South-East) -->
    <polygon points="242,102 316,96 292,164 214,158 212,126" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="262" y="135" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">福建</text>

    <!-- Guangdong (South) -->
    <polygon points="46,146 118,142 214,158 228,178 65,178" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="142" y="170" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">广东</text>

    <!-- Jiangxi (Center - Highlighted!) -->
    <polygon points="112,68 162,56 198,68 242,102 212,126 214,158 118,142" fill="url(#highlightGrad)" stroke="#b45309" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="172" cy="106" r="18" fill="#ffffff" opacity="0.92"/>
    <text x="172" y="113" font-size="20" font-weight="800" fill="#b45309" text-anchor="middle">?</text>
  </g>

  <!-- Answer & Benefit right -->
  <rect x="438" y="300" width="338" height="42" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="454" y="326" font-size="14" font-weight="700" fill="#047857">答案（A）：江西省</text>
  <text x="585" y="325" font-size="12" fill="#059669">（一眼建立空间拓扑记忆）</text>
</svg>
